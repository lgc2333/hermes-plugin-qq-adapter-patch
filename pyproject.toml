[project]
name = "hermes-qq-adapter-patch"
version = "1.2.0"
description = "Hermes directory plugin patching the built-in QQ Bot adapter"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "lgc2333" }]

[tool.pytest.ini_options]
# importlib mode: tests live inside the plugin package, whose directory name is not a
# valid Python identifier ("qq-adapter-patch"), so pytest's default prepend mode tries
# to import the plugin __init__ as a plain top-level module and breaks its relative imports.
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
