name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hermes is pinned to the LATEST RELEASE TAG, resolved at run time, not to
# `main`: the tag is the tree users actually run, while `main` moves fast
# enough that a test merged hours ago fails this fork before the matching
# upstream fix has been ported (seen 2026-09-20 with the QQ STT timeout test).
# The resolved tag is printed in the run log.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Resolve latest Hermes release tag
        id: hermes_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            tag="$(git ls-remote --tags --refs --sort=-v:refname \
              https://github.com/NousResearch/hermes-agent.git 2>/dev/null \
              | head -n1 | sed 's#.*refs/tags/##')"
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve a Hermes release tag"
            exit 1
          fi
          echo "Hermes release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes_release.outputs.tag }}
          path: hermes

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # No actions/setup-python step: Hermes' pyproject pins its interpreter
      # through `tool.uv.environments`, so `uv sync` provisions the locked
      # CPython itself and a runner-provided python is simply ignored.
      - name: Install Hermes test dependencies
        working-directory: hermes
        run: uv sync --locked --group dev --group test --extra messaging

      - name: Upstream QQ plugin import smoke
        working-directory: hermes
        run: |
          uv run python - <<'PY'
          from plugins.platforms.qqbot import register
          from plugins.platforms.qqbot.adapter import QQAdapter, check_qq_requirements
          assert register is not None and QQAdapter is not None
          assert check_qq_requirements()
          print('upstream qqbot import smoke ok')
          PY

      - name: Plugin doctor
        working-directory: hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes:${{ github.workspace }}/plugin
        run: uv run hermes plugins doctor ${{ github.workspace }}/plugin

      - name: Install the fork over the upstream QQ plugin for upstream tests
        run: |
          # Overwrite the package SOURCES but keep the upstream plugin.yaml: bundled-platform
          # discovery requires __init__.py AND plugin.yaml in the directory. Without it
          # `bundled_authz("qqbot")` returns {} and the scope/authz tests fail on env names.
          find hermes/plugins/platforms/qqbot -maxdepth 1 -name '*.py' -delete
          cp -a plugin/qq_adapter_patch/*.py hermes/plugins/platforms/qqbot/
          test -f hermes/plugins/platforms/qqbot/plugin.yaml

      - name: Upstream QQ plugin tests against the fork
        working-directory: hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: uv run pytest -q tests/gateway/test_qqbot.py tests/gateway/test_qqbot_credential_isolation.py tests/gateway/test_qqbot_scope_paths.py tests/gateway/test_qqbot_update_prompt_key.py

      - name: Plugin tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        # pytest's own entry point, not `python -m pytest`: the latter puts the
        # plugin directory on sys.path, where top-level names could shadow
        # Hermes modules.
        run: ${{ github.workspace }}/hermes/.venv/bin/pytest -q tests
