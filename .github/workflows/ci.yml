name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hermes is pinned to the LATEST RELEASE TAG, resolved at run time, not to
# `main`: the tag is the tree users actually run, while `main` moves fast
# enough that a test merged hours ago fails this fork before the matching
# upstream fix has been ported (seen 2026-09-20 with the QQ STT timeout test).
# The resolved tag is printed in the run log.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Resolve latest Hermes release tag
        id: hermes_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            tag="$(git ls-remote --tags --refs --sort=-v:refname \
              https://github.com/NousResearch/hermes-agent.git 2>/dev/null \
              | head -n1 | sed 's#.*refs/tags/##')"
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve a Hermes release tag"
            exit 1
          fi
          echo "Hermes release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes_release.outputs.tag }}
          path: hermes

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Hermes test dependencies
        working-directory: hermes
        run: uv sync --locked --extra dev --extra messaging

      - name: Upstream QQ adapter import smoke
        working-directory: hermes
        run: |
          uv run python - <<'PY'
          from gateway.platforms.qqbot import QQAdapter, check_qq_requirements
          assert QQAdapter is not None
          assert check_qq_requirements()
          print('upstream qqbot import smoke ok')
          PY

      - name: Plugin doctor
        working-directory: hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes:${{ github.workspace }}/plugin
        run: uv run hermes plugins doctor ${{ github.workspace }}/plugin

      - name: Install plugin adapter over upstream QQ adapter for upstream tests
        run: |
          cp plugin/adapter.py hermes/gateway/platforms/qqbot/adapter.py

      - name: Upstream QQ adapter tests with plugin adapter
        working-directory: hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes:${{ github.workspace }}/plugin
        run: uv run pytest -q tests/gateway/test_qqbot.py tests/gateway/test_qqbot_credential_isolation.py tests/gateway/test_qqbot_scope_paths.py

      - name: Plugin tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes:${{ github.workspace }}/plugin
        run: ${{ github.workspace }}/hermes/.venv/bin/python -m pytest -q tests
